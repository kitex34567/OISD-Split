<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Plane – Bubu &amp; Dudu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=414,H=896;
const GRAVITY=0.52,FLAP_V=-11,PIPE_SPEED=3,PIPE_GAP=175,PIPE_MS=1900,GH=110,PLANE_X=110;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
  scale=Math.min(innerWidth/W,innerHeight/H);
  canvas.width=W*scale|0; canvas.height=H*scale|0;
}
window.addEventListener('resize',resize); resize();

// --- state ---
// states: START | SELECT | PLAYING | GAMEOVER
let state='START', score=0, best=0, muted=false;
let selectedChar='bubu'; // 'bubu' or 'dudu'
let plane={x:PLANE_X,y:H/2,vy:0,angle:0};
let pipes=[],coins=[],lastPipe=0,propA=0,t=0,hillX=0;

let clouds=[];
for(let i=0;i<6;i++) clouds.push({x:Math.random()*W,y:50+Math.random()*180,r:28+Math.random()*36,spd:0.25+Math.random()*0.4});

// --- input ---
function flap(){
  if(state==='PLAYING') plane.vy=FLAP_V;
}
function tap(e){
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const cx=((e.touches?e.touches[0].clientX:e.clientX)-rect.left)/scale;
  const cy=((e.touches?e.touches[0].clientY:e.clientY)-rect.top)/scale;
  // sound toggle
  if(Math.hypot(cx-(W-46),cy-46)<24){muted=!muted;return;}

  if(state==='START'){
    state='SELECT';
    return;
  }
  if(state==='SELECT'){
    // Bubu card: left half
    if(cx<W/2-10 && cy>H/2-140 && cy<H/2+100){selectedChar='bubu';startGame();return;}
    // Dudu card: right half
    if(cx>W/2+10 && cy>H/2-140 && cy<H/2+100){selectedChar='dudu';startGame();return;}
    // play button below
    if(cy>H/2+110 && cy<H/2+190){startGame();return;}
    return;
  }
  if(state==='GAMEOVER'){
    if(cx>W/2-120&&cx<W/2+0&&cy>H/2+98&&cy<H/2+152){reset();return;}
    if(cx>W/2+0&&cx<W/2+120&&cy>H/2+98&&cy<H/2+152){reset();state='SELECT';return;}
  }
  flap();
}
canvas.addEventListener('click',tap);
canvas.addEventListener('touchstart',tap,{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    if(state==='START'){state='SELECT';}
    else if(state==='SELECT'){startGame();}
    else flap();
  }
});

function startGame(){state='PLAYING';plane.vy=FLAP_V;}
function reset(){
  plane={x:PLANE_X,y:H/2,vy:0,angle:0};
  pipes=[];coins=[];score=0;lastPipe=0;state='PLAYING';
}

// ===== HELPERS =====
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function blob(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}

// ===== SKY =====
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H-GH);
  g.addColorStop(0,'#6EC6E8');g.addColorStop(1,'#C5E8F7');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H-GH);
}

// ===== CLOUDS =====
function drawCloud(x,y,r){
  ctx.fillStyle='rgba(255,255,255,0.93)';
  blob(x,y,r);blob(x-r*.6,y+r*.25,r*.68);blob(x+r*.6,y+r*.25,r*.68);
  blob(x-r*.28,y+r*.45,r*.52);blob(x+r*.28,y+r*.45,r*.52);
}
function drawClouds(){clouds.forEach(c=>drawCloud(c.x,c.y,c.r));}

// ===== GROUND =====
function drawGround(){
  const gy=H-GH;
  const g=ctx.createLinearGradient(0,gy,0,H);
  g.addColorStop(0,'#6dbf58');g.addColorStop(0.4,'#58a845');g.addColorStop(1,'#3d8830');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,H);
  for(let i=0;i<=10;i++){
    const x=(i/10)*W;
    ctx.lineTo(x,gy+12*Math.sin((x+hillX)/90));
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8B5E3C';ctx.fillRect(0,H-18,W,18);
  [50,170,310,430,570,700,840].forEach(tx=>{
    const x=((tx-hillX*0.7)%W+W)%W;
    ctx.fillStyle='#7B4F28';ctx.fillRect(x-5,gy-14,10,22);
    ctx.fillStyle='#4a9d3e';blob(x,gy-22,18);
    ctx.fillStyle='#5ab74e';blob(x-5,gy-34,13);blob(x+4,gy-37,11);
  });
}

// ===== PIPE =====
function drawPipe(x,topH){
  const pw=72,cw=84,ch=26;
  const tg=ctx.createLinearGradient(x,0,x+pw,0);
  tg.addColorStop(0,'#4CAF50');tg.addColorStop(0.35,'#76d275');tg.addColorStop(0.7,'#43A047');tg.addColorStop(1,'#2E7D32');
  const cg=ctx.createLinearGradient(x,0,x+cw,0);
  cg.addColorStop(0,'#4CAF50');cg.addColorStop(0.3,'#81C784');cg.addColorStop(0.7,'#43A047');cg.addColorStop(1,'#2E7D32');
  // top
  ctx.fillStyle=tg;rr(ctx,x+6,0,pw,topH-ch,4);ctx.fill();
  ctx.fillStyle=cg;rr(ctx,x,topH-ch,cw,ch,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';rr(ctx,x+9,0,14,topH-ch,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';rr(ctx,x+4,topH-ch,16,ch,6);ctx.fill();
  ctx.strokeStyle='#1B5E20';ctx.lineWidth=2;rr(ctx,x+6,0,pw,topH-ch,4);ctx.stroke();
  ctx.strokeStyle='#1B5E20';rr(ctx,x,topH-ch,cw,ch,10);ctx.stroke();
  // bottom
  const botY=topH+PIPE_GAP, botH=H-GH-botY;
  ctx.fillStyle=cg;rr(ctx,x,botY,cw,ch,10);ctx.fill();
  ctx.fillStyle=tg;rr(ctx,x+6,botY+ch,pw,botH-ch,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';rr(ctx,x+4,botY,16,ch,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';rr(ctx,x+9,botY+ch,14,botH-ch,3);ctx.fill();
  ctx.strokeStyle='#1B5E20';ctx.lineWidth=2;rr(ctx,x,botY,cw,ch,10);ctx.stroke();
  rr(ctx,x+6,botY+ch,pw,botH-ch,4);ctx.stroke();
}

// ===== COIN =====
function drawCoin(x,y){
  ctx.save();ctx.translate(x,y);ctx.scale(Math.cos(t*0.0025),1);
  const g=ctx.createRadialGradient(-5,-5,2,0,0,16);
  g.addColorStop(0,'#FFE566');g.addColorStop(0.5,'#FFD700');g.addColorStop(1,'#CC9900');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#AA8800';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#FF6B6B';ctx.save();ctx.scale(0.45,0.45);
  ctx.beginPath();ctx.moveTo(0,5);
  ctx.bezierCurveTo(-12,-5,-20,0,-18,10);ctx.bezierCurveTo(-16,18,0,24,0,24);
  ctx.bezierCurveTo(0,24,16,18,18,10);ctx.bezierCurveTo(20,0,12,-5,0,5);
  ctx.fill();ctx.restore();ctx.restore();
}

// ===== BUBU – braun Bär =====
// Bubu ist der BRAUNE Bär (links im Bild)
function drawBubu(c, sz=1){
  c.save();c.scale(sz,sz);
  // Ohren
  [[-12,-12],[12,-12]].forEach(([ex,ey])=>{
    c.fillStyle='#C8844E';c.beginPath();c.arc(ex,ey,8,0,Math.PI*2);c.fill();
    c.strokeStyle='#7B4520';c.lineWidth=1.5;c.stroke();
  });
  // Kopf
  c.fillStyle='#C8844E';
  c.beginPath();c.arc(0,0,16,0,Math.PI*2);c.fill();
  c.strokeStyle='#7B4520';c.lineWidth=2;c.stroke();
  // Wangen (groß, rötlich-orange wie im Bild)
  c.fillStyle='rgba(220,140,80,0.55)';
  c.beginPath();c.ellipse(-11,5,7,5,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(11,5,7,5,0,0,Math.PI*2);c.fill();
  // Augen – dunkle Kreise, leicht nach unten gezogen (kawaii-Stil)
  c.fillStyle='#2A1500';
  c.beginPath();c.arc(-5,-2,3.2,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(5,-2,3.2,0,Math.PI*2);c.fill();
  // Augen-Glanz
  c.fillStyle='#FFF';
  c.beginPath();c.arc(-4,-3.2,1.2,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(6,-3.2,1.2,0,Math.PI*2);c.fill();
  // Kleiner Strich unter Augen (kawaii Wimpern)
  c.strokeStyle='#7B4520';c.lineWidth=1.2;
  c.beginPath();c.moveTo(-6.5,1.5);c.lineTo(-3.5,1.5);c.stroke();
  c.beginPath();c.moveTo(3.5,1.5);c.lineTo(6.5,1.5);c.stroke();
  // Nase
  c.fillStyle='#7B4520';
  c.beginPath();c.ellipse(0,5,3,2,0,0,Math.PI*2);c.fill();
  // Zunge raus
  c.fillStyle='#FF8080';
  c.beginPath();c.ellipse(0,11,4,5,0,0,Math.PI*2);c.fill();
  c.strokeStyle='#FF5555';c.lineWidth=1;
  c.beginPath();c.moveTo(0,8);c.lineTo(0,14);c.stroke();
  c.restore();
}

// ===== DUDU – weißer Panda =====
// Dudu ist der WEISSE Panda (rechts im Bild)
function drawDudu(c, sz=1){
  c.save();c.scale(sz,sz);
  // Ohren – weiß mit schwarzer Oberseite
  [[-12,-12],[12,-12]].forEach(([ex,ey])=>{
    c.fillStyle='#1A1A1A';c.beginPath();c.arc(ex,ey,8,0,Math.PI*2);c.fill();
    c.fillStyle='#EEEEEE';c.beginPath();c.arc(ex,ey+2,5,0,Math.PI*2);c.fill();
  });
  // Kopf – weiß
  c.fillStyle='#F0F0F0';
  c.beginPath();c.arc(0,0,16,0,Math.PI*2);c.fill();
  c.strokeStyle='#CCCCCC';c.lineWidth=2;c.stroke();
  // Augenpatch – schwarze Ovale
  c.fillStyle='#1A1A1A';
  c.beginPath();c.ellipse(-6,-2,5.5,5.5,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(6,-2,5.5,5.5,0,0,Math.PI*2);c.fill();
  // Augen – weiß in den Patches
  c.fillStyle='#FFFFFF';
  c.beginPath();c.arc(-6,-2,3,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(6,-2,3,0,Math.PI*2);c.fill();
  // Pupillen
  c.fillStyle='#1A1A1A';
  c.beginPath();c.arc(-6,-2,1.5,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(6,-2,1.5,0,Math.PI*2);c.fill();
  // Glanz
  c.fillStyle='#FFFFFF';
  c.beginPath();c.arc(-5.2,-3,0.8,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(6.8,-3,0.8,0,Math.PI*2);c.fill();
  // Wangen – rosa
  c.fillStyle='rgba(255,150,150,0.55)';
  c.beginPath();c.ellipse(-12,4,5,4,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(12,4,5,4,0,0,Math.PI*2);c.fill();
  // Nase
  c.fillStyle='#555';
  c.beginPath();c.ellipse(0,4,2.5,2,0,0,Math.PI*2);c.fill();
  // Zunge raus
  c.fillStyle='#FF8080';
  c.beginPath();c.ellipse(0,11,4,5,0,0,Math.PI*2);c.fill();
  c.strokeStyle='#FF5555';c.lineWidth=1;
  c.beginPath();c.moveTo(0,8);c.lineTo(0,14);c.stroke();
  // Fliege
  c.fillStyle='#1A1A1A';
  c.beginPath();c.moveTo(-7,20);c.lineTo(0,23);c.lineTo(-7,26);c.closePath();c.fill();
  c.beginPath();c.moveTo(7,20);c.lineTo(0,23);c.lineTo(7,26);c.closePath();c.fill();
  c.beginPath();c.arc(0,23,2.5,0,Math.PI*2);c.fill();
  c.restore();
}

// ===== FLUGZEUG – fliegt nach rechts =====
function drawPlane(x,y,angle,pa){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(1.15,1.15);

  // Alles gespiegelt → Nase zeigt nach rechts
  ctx.save();
  ctx.scale(-1,1);

  // Rumpf
  ctx.fillStyle='#FF6B6B';
  ctx.beginPath();ctx.ellipse(0,0,54,20,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#D04040';ctx.lineWidth=2;ctx.stroke();
  // Leitwerk vertikal
  ctx.fillStyle='#FF6B6B';
  ctx.beginPath();ctx.moveTo(34,-4);ctx.lineTo(52,-26);ctx.lineTo(56,-4);ctx.closePath();ctx.fill();ctx.stroke();
  // Leitwerk horizontal
  ctx.beginPath();ctx.moveTo(38,4);ctx.lineTo(58,9);ctx.lineTo(54,16);ctx.lineTo(36,12);ctx.closePath();ctx.fill();
  // Oberflügel
  ctx.fillStyle='#FFD93D';
  ctx.beginPath();ctx.moveTo(25,-10);ctx.lineTo(25,-20);
  ctx.bezierCurveTo(0,-20,-35,-26,-50,-30);
  ctx.lineTo(-50,-20);ctx.bezierCurveTo(-35,-18,0,-12,25,-10);
  ctx.closePath();ctx.fill();ctx.strokeStyle='#E5C020';ctx.lineWidth=1.5;ctx.stroke();
  // Unterflügel
  ctx.fillStyle='#FFD93D';
  ctx.beginPath();ctx.moveTo(22,10);ctx.lineTo(22,20);
  ctx.bezierCurveTo(0,20,-32,26,-46,30);
  ctx.lineTo(-46,22);ctx.bezierCurveTo(-32,18,0,12,22,10);
  ctx.closePath();ctx.fill();ctx.stroke();
  // Streben
  ctx.strokeStyle='#C8A010';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(-18,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-10);ctx.lineTo(8,10);ctx.stroke();
  // Triebwerk / Nase
  ctx.fillStyle='#FF9500';
  ctx.beginPath();ctx.ellipse(-50,0,14,18,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#D07800';ctx.lineWidth=2;ctx.stroke();
  // Propeller
  ctx.save();ctx.translate(-58,0);ctx.rotate(pa);
  ctx.fillStyle='#8B6914';
  ctx.beginPath();ctx.ellipse(0,-22,5,22,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,22,5,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#666';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Cockpit-Ring
  ctx.fillStyle='#8B6040';
  ctx.beginPath();ctx.ellipse(-10,-10,17,13,0,0,Math.PI*2);ctx.fill();

  ctx.restore(); // Ende gespiegelt

  // Charakter im Cockpit – NICHT gespiegelt zeichnen
  // Front-Cockpit: im gespiegelten Flugzeug war es bei x=-10 → jetzt bei x=+10
  ctx.save();
  ctx.translate(10,-24);
  ctx.scale(0.85,0.85);
  if(selectedChar==='bubu') drawBubu(ctx);
  else drawDudu(ctx);
  ctx.restore();

  ctx.restore();
}

// ===== SCORE =====
function drawScore(sc){
  ctx.save();
  ctx.font='bold 54px Arial Black,Arial';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=6;ctx.strokeText(sc,W/2,28);
  ctx.fillStyle='#FFFFFF';ctx.fillText(sc,W/2,28);
  ctx.restore();
}

// ===== START SCREEN =====
function drawStart(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.15)';rr(ctx,W/2-170,H/2-140,340,120,20);ctx.fill();
  ctx.font='bold 64px Arial Black,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeStyle='#333';ctx.lineWidth=7;
  ctx.strokeText('FLAPPY',W/2,H/2-100);ctx.fillStyle='#FF6B6B';ctx.fillText('FLAPPY',W/2,H/2-100);
  ctx.strokeText('PLANE ✈',W/2,H/2-38);ctx.fillStyle='#FFD93D';ctx.fillText('PLANE ✈',W/2,H/2-38);
  ctx.font='bold 24px Arial';ctx.strokeStyle='#444';ctx.lineWidth=4;
  ctx.strokeText('Bubu & Dudu',W/2,H/2+10);ctx.fillStyle='#FFF';ctx.fillText('Bubu & Dudu',W/2,H/2+10);
  // Play-Button
  const bx=W/2,by=H/2+110;
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.arc(bx,by+7,68,0,Math.PI*2);ctx.fill();
  const bg=ctx.createRadialGradient(bx-16,by-16,4,bx,by,68);
  bg.addColorStop(0,'#FF8C8C');bg.addColorStop(1,'#E53935');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,68,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#B71C1C';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#FFF';ctx.beginPath();ctx.moveTo(bx-20,by-24);ctx.lineTo(bx+28,by);ctx.lineTo(bx-20,by+24);ctx.closePath();ctx.fill();
  ctx.font='bold 22px Arial';ctx.strokeStyle='#333';ctx.lineWidth=4;
  ctx.strokeText('Tap to Start!',W/2,by+100);ctx.fillStyle='#FFD93D';ctx.fillText('Tap to Start!',W/2,by+100);
  ctx.restore();
}

// ===== CHARAKTER-WAHL =====
function drawSelect(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,W,H);
  // Titel
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 38px Arial Black,Arial';
  ctx.strokeStyle='#333';ctx.lineWidth=6;ctx.strokeText('Wähle deinen Piloten!',W/2,H/2-190);
  ctx.fillStyle='#FFD93D';ctx.fillText('Wähle deinen Piloten!',W/2,H/2-190);

  const cardW=150,cardH=240,cardR=22;
  // --- Bubu Karte ---
  const bx=W/2-100,by=H/2-140;
  const bubuSel=selectedChar==='bubu';
  ctx.fillStyle=bubuSel?'rgba(255,200,120,0.95)':'rgba(255,240,200,0.85)';
  rr(ctx,bx,by,cardW,cardH,cardR);ctx.fill();
  ctx.strokeStyle=bubuSel?'#FF9500':'#CCC';ctx.lineWidth=bubuSel?5:2;
  rr(ctx,bx,by,cardW,cardH,cardR);ctx.stroke();
  // Bubu groß
  ctx.save();ctx.translate(bx+cardW/2,by+90);ctx.scale(2.8,2.8);drawBubu(ctx);ctx.restore();
  ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#7B4520';ctx.fillText('Bubu',bx+cardW/2,by+cardH-28);
  ctx.font='14px Arial';ctx.fillStyle='#AA7050';ctx.fillText('Brauner Bär 🐻',bx+cardW/2,by+cardH-10);
  if(bubuSel){
    ctx.fillStyle='#FF9500';ctx.font='bold 18px Arial';
    ctx.fillText('✓ Ausgewählt',bx+cardW/2,by+cardH+18);
  }

  // --- Dudu Karte ---
  const dx=W/2+10,dy=H/2-140;
  const duduSel=selectedChar==='dudu';
  ctx.fillStyle=duduSel?'rgba(200,220,255,0.95)':'rgba(230,240,255,0.85)';
  rr(ctx,dx,dy,cardW,cardH,cardR);ctx.fill();
  ctx.strokeStyle=duduSel?'#4488FF':'#CCC';ctx.lineWidth=duduSel?5:2;
  rr(ctx,dx,dy,cardW,cardH,cardR);ctx.stroke();
  // Dudu groß
  ctx.save();ctx.translate(dx+cardW/2,dy+90);ctx.scale(2.8,2.8);drawDudu(ctx);ctx.restore();
  ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#333';ctx.fillText('Dudu',dx+cardW/2,dy+cardH-28);
  ctx.font='14px Arial';ctx.fillStyle='#555';ctx.fillText('Weißer Panda 🐼',dx+cardW/2,dy+cardH-10);
  if(duduSel){
    ctx.fillStyle='#4488FF';ctx.font='bold 18px Arial';
    ctx.fillText('✓ Ausgewählt',dx+cardW/2,dy+cardH+18);
  }

  // Play-Button
  const py2=H/2+130;
  ctx.fillStyle='rgba(0,0,0,0.2)';rr(ctx,W/2-110,py2+5,220,56,30);ctx.fill();
  const pbg=ctx.createLinearGradient(W/2-110,py2,W/2+110,py2+56);
  pbg.addColorStop(0,'#FF6B6B');pbg.addColorStop(1,'#E53935');
  ctx.fillStyle=pbg;rr(ctx,W/2-110,py2,220,56,30);ctx.fill();
  ctx.strokeStyle='#B71C1C';ctx.lineWidth=2;rr(ctx,W/2-110,py2,220,56,30);ctx.stroke();
  ctx.font='bold 26px Arial Black,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#FFF';ctx.fillText('Los geht\'s! ✈',W/2,py2+28);
  ctx.restore();
}

// ===== GAME OVER =====
function drawStar(x,y,r,col){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=(i*4*Math.PI)/5-Math.PI/2,ai=((i*4+2)*Math.PI)/5-Math.PI/2;
    if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    ctx.lineTo(Math.cos(ai)*r*.4,Math.sin(ai)*r*.4);
  }
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawGameOver(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.48)';ctx.fillRect(0,0,W,H);
  const px=W/2-165,py=H/2-170;
  const pg=ctx.createLinearGradient(px,py,px,py+360);
  pg.addColorStop(0,'#FFF9E8');pg.addColorStop(1,'#FFE8CC');
  ctx.fillStyle=pg;rr(ctx,px,py,330,360,28);ctx.fill();
  ctx.strokeStyle='#FFD93D';ctx.lineWidth=4;rr(ctx,px,py,330,360,28);ctx.stroke();
  const cols=['#FF6B6B','#FF9800','#FFD93D','#6BCB77','#4D96FF','#B06EFF'];
  ctx.font='bold 46px Arial Black,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeStyle='#333';ctx.lineWidth=5;ctx.strokeText('GAME OVER',W/2,H/2-110);
  const go='GAME OVER';
  ctx.save();ctx.textAlign='left';
  const tw=ctx.measureText(go).width;
  let sx=W/2-tw/2;
  go.split('').forEach((l,i)=>{
    ctx.fillStyle=cols[i%cols.length];ctx.fillText(l,sx,H/2-110);sx+=ctx.measureText(l).width;
  });
  ctx.restore();
  ctx.textAlign='center';
  ctx.font='bold 26px Arial';ctx.fillStyle='#888';ctx.fillText('SCORE',W/2,H/2-60);
  ctx.font='bold 56px Arial Black,Arial';ctx.strokeStyle='#333';ctx.lineWidth=5;
  ctx.strokeText(score,W/2,H/2-10);ctx.fillStyle='#FF6B6B';ctx.fillText(score,W/2,H/2-10);
  ctx.font='bold 20px Arial';ctx.fillStyle='#AAA';ctx.fillText('Best: '+best,W/2,H/2+38);
  // Charakter-Preview im GameOver
  ctx.save();ctx.translate(W/2,H/2+75);ctx.scale(1.8,1.8);
  if(selectedChar==='bubu') drawBubu(ctx); else drawDudu(ctx);
  ctx.restore();
  // Sterne
  const stars=score<3?0:score<8?1:score<18?2:3;
  for(let i=0;i<3;i++) drawStar(W/2-50+i*50,H/2+130,14,i<stars?'#FFD700':'#DDD');
  // Retry
  ctx.fillStyle='#4CAF50';rr(ctx,W/2-120,H/2+150,110,52,26);ctx.fill();
  ctx.strokeStyle='#2E7D32';ctx.lineWidth=2;rr(ctx,W/2-120,H/2+150,110,52,26);ctx.stroke();
  ctx.font='bold 19px Arial';ctx.fillStyle='#FFF';ctx.textAlign='center';
  ctx.fillText('🔄 Retry',W/2-65,H/2+176);
  // Home
  ctx.fillStyle='#FF6B6B';rr(ctx,W/2+10,H/2+150,110,52,26);ctx.fill();
  ctx.strokeStyle='#C62828';ctx.lineWidth=2;rr(ctx,W/2+10,H/2+150,110,52,26);ctx.stroke();
  ctx.fillStyle='#FFF';ctx.fillText('🏠 Home',W/2+65,H/2+176);
  ctx.restore();
}

// ===== SOUND ICON =====
function drawSound(){
  const x=W-46,y=46;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFF';ctx.strokeStyle='#FFF';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(-4,-6);ctx.lineTo(4,-12);ctx.lineTo(4,12);ctx.lineTo(-4,6);ctx.lineTo(-10,6);ctx.closePath();ctx.fill();
  if(!muted){
    ctx.beginPath();ctx.arc(4,0,8,-Math.PI/3,Math.PI/3);ctx.stroke();
    ctx.beginPath();ctx.arc(4,0,13,-Math.PI/4,Math.PI/4);ctx.stroke();
  } else {
    ctx.strokeStyle='#FF6B6B';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(8,-8);ctx.lineTo(18,8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(18,-8);ctx.lineTo(8,8);ctx.stroke();
  }
  ctx.restore();
}

// ===== KOLLISION =====
function hit(){
  const r=18;
  if(plane.y+r>H-GH||plane.y-r<0) return true;
  for(const p of pipes){
    if(plane.x+r>p.x+4&&plane.x-r<p.x+76){
      if(plane.y-r<p.th||plane.y+r>p.th+PIPE_GAP) return true;
    }
  }
  return false;
}

// ===== UPDATE =====
function update(now){
  clouds.forEach(c=>{c.x-=c.spd;if(c.x+c.r*2<0){c.x=W+c.r*2;c.y=50+Math.random()*180;}});
  if(state!=='PLAYING') return;
  hillX+=PIPE_SPEED;
  plane.vy+=GRAVITY; plane.y+=plane.vy;
  plane.angle=Math.max(-0.48,Math.min(0.82,plane.vy*0.052));
  propA+=0.32;
  if(now-lastPipe>PIPE_MS||lastPipe===0){
    const th=90+Math.random()*(H-GH-PIPE_GAP-180);
    pipes.push({x:W+10,th,scored:false});
    if(Math.random()>0.38) coins.push({x:W+50,y:th+PIPE_GAP/2});
    lastPipe=now;
  }
  pipes.forEach(p=>{p.x-=PIPE_SPEED;if(!p.scored&&p.x+76<plane.x){p.scored=true;score++;}});
  pipes=pipes.filter(p=>p.x>-100);
  coins.forEach(c=>c.x-=PIPE_SPEED);
  for(let i=coins.length-1;i>=0;i--){
    if(Math.hypot(plane.x-coins[i].x,plane.y-coins[i].y)<32){coins.splice(i,1);score+=2;}
  }
  coins=coins.filter(c=>c.x>-40);
  if(hit()){best=Math.max(best,score);state='GAMEOVER';}
}

// ===== RENDER =====
function render(){
  ctx.save();ctx.scale(scale,scale);
  drawSky();drawClouds();
  pipes.forEach(p=>drawPipe(p.x,p.th));
  coins.forEach(c=>drawCoin(c.x,c.y));
  drawGround();
  drawPlane(plane.x,plane.y,plane.angle,propA);
  if(state==='PLAYING'||state==='GAMEOVER') drawScore(score);
  if(state==='START') drawStart();
  if(state==='SELECT') drawSelect();
  if(state==='GAMEOVER') drawGameOver();
  drawSound();
  ctx.restore();
}

// ===== LOOP =====
let t=0;
function loop(now){
  t=now;
  update(now);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
