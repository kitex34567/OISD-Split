name: Update OISD EDL Lists

on:
  schedule:
    # Daily at 04:00 UTC – OISD updates hourly; once per day is sufficient
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run split_oisd.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python split_oisd.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lists/ index.html
          # Only commit when there are actual changes
          if git diff --cached --quiet; then
            echo "No changes – skipping commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: update OISD EDL lists [${TIMESTAMP}]"
            git push
          fi
